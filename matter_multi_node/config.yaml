name: "Matter Multi-Node"
slug: "matter_multi_node"
description: "Exposes Home Assistant switches, lights, climate (AC/thermostats), and sensors as individual standalone Matter devices to bypass Google Home Matter bridge bugs."
version: "1.4.0"
startup: "services"
boot: "auto"
init: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:cube-outline"
panel_title: "Matter Nodes"
homeassistant_api: true
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
options:
  start_port: 5541
  discriminator_start: 3841
  passcode: 20202021
  filter_domains:
    - switch
    - input_boolean
    - sensor
    - light
    - climate
  include_entities: []
  exclude_entities: []
schema:
  start_port: int
  discriminator_start: int
  passcode: int
  filter_domains:
    - str
  include_entities:
    - str
  exclude_entities:
    - str
