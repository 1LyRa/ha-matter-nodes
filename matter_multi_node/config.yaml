name: "Matter Multi-Node"
slug: "matter_multi_node"
description: "Exposes Home Assistant switches, lights, climate (AC/thermostats), and sensors as individual standalone Matter devices tailored specifically for Google Home to bypass Matter bridge bugs."
version: "1.7.1"
# Uncomment after publishing multi-arch images with GitHub Actions workflow to enable layer download progress bar in HA:
# image: "ghcr.io/1lyra/matter_multi_node-{arch}"
startup: "services"
boot: "auto"
init: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:hub"
panel_title: "Matter Nodes"
homeassistant_api: true
hassio_api: true
hassio_role: "manager"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
options:
  start_port: 5541
  discriminator_start: 3841
  passcode: 20202021
  filter_domains:
    - switch
    - input_boolean
    - sensor
    - binary_sensor
    - light
    - climate
    - fan
  include_entities: []
  exclude_entities: []
  show_all_sensors: false
schema:
  start_port: int
  discriminator_start: int
  passcode: int
  filter_domains:
    - str
  include_entities:
    - str
  exclude_entities:
    - str
  show_all_sensors: bool?
